  [[-1, 1, SAE, [256]],
   [-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, MSACA, [128]],
   [-1, 3, C3, [512, False]],

