   [-1, 3, C3, [512, False]],

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 11], 1, MSACA, [128]],
   [-1, 3, C3, [1024, False]],

   [[19, 22, 25], 1, Detect, [nc, anchors]]]
